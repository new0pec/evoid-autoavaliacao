<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoavaliação e Feedback — EvoID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --success: #10b981;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, #1e293b 100%);
      color: white;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }
    header p {
      color: #cbd5e1;
      font-size: 1rem;
      max-width: 600px;
    }

    .progress-container {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #60a5fa);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 4px;
    }
    .progress-text {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      font-style: italic;
      padding-left: 0.25rem;
    }

    .question {
      margin-bottom: 1.75rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .question:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .question label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.85rem;
      font-size: 0.98rem;
      color: var(--text);
    }

    .scale {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-start;
    }
    .scale input[type="radio"] { display: none; }
    .scale label {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: #fff;
      color: var(--text);
    }
    .scale label:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.05);
    }
    .scale input[type="radio"]:checked + label {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      transform: scale(1.05);
    }

    .scale-legend {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
      padding: 0 0.25rem;
    }

    textarea, input[type="text"], input[type="email"] {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.98rem;
      font-family: inherit;
      transition: all 0.2s ease;
      background: #fafbfc;
    }
    textarea { resize: vertical; min-height: 100px; }
    input[type="text"], input[type="email"] { min-height: auto; padding: 0.85rem 1rem; }
    textarea:focus, input[type="text"]:focus, input[type="email"]:focus {
      outline: none;
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 1.1rem 2rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 640px) {
      body { padding: 1rem 0.75rem; }
      header { padding: 2rem 1.5rem; }
      header h1 { font-size: 1.5rem; }
      .card { padding: 1.5rem; }
      .scale label { width: 36px; height: 36px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Autoavaliação e Feedback — EvoID</h1>
    <p>Avalia cada ponto de 1 (Muito baixo) a 10 (Excelente) e partilha a tua reflexão de forma honesta e construtiva.</p>
  </header>

  <div class="progress-container">
    <div class="progress-text" id="progressText">Progresso: 0%</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <form id="evoidForm" action="https://formspree.io/f/mljbdojp" method="POST">
    <input type="hidden" name="_subject" value="Nova Autoavaliação EvoID">
    <input type="hidden" name="_replyto" id="replyto" value="">
    <div class="card">
      <h2>Identificação</h2>
      <div class="question">
        <label for="nome">O teu Nome:</label>
        <input type="text" id="nome" name="Nome" required placeholder="Escreve o teu nome completo">
      </div>
      <div class="question">
        <label for="email">Coloca o teu email</label>
        <input type="email" id="email" name="Email" required placeholder="o.teu@email.com">
      </div>
    </div>

    <div id="sectionsContainer"></div>

    <button type="submit" class="btn-submit">Concluir e enviar cópia para o Email.</button>
    <p class="footer-note">Ao submeter, as respostas são enviadas de forma segura. Uma cópia fica registada e podes receber confirmação no teu email.</p>
  </form>
</div>

<script>
  const surveyData = [
    {
      title: "1. Dedicação e Organização Pessoal",
      type: "scale",
      questions: [
        "1.1. Tempo que tenho dedicado ao projeto EvoID",
        "1.2. Iniciativa para aprender e pesquisar por conta própria",
        "1.3. Organização do meu tempo e das minhas tarefas",
        "1.4. Cumprimento das responsabilidades que assumi",
        "1.5. Capacidade de tomar iniciativa sem estar à espera de indicações",
        "1.6. Motivação e vontade de contribuir para o crescimento da EvoID"
      ]
    },
    {
      title: "2. Preparação e Planeamento de Treinos",
      type: "scale",
      questions: [
        "2.1. Conhecimento para estruturar sessões de treino com objetivos definidos",
        "2.2. Trabalho que tenho desenvolvido na preparação de sessões de treino",
        "2.3. Capacidade de adaptar exercícios aos diferentes escalões etários",
        "2.4. Capacidade de adaptar exercícios ao nível e às capacidades individuais dos atletas",
        "2.5. Conhecimento das necessidades específicas das diferentes posições em campo",
        "2.6. Capacidade de adaptar o treino às necessidades individuais de atletas masculinos e femininos",
        "2.7. Conhecimento sobre progressões, intensidade, duração e organização dos exercícios",
        "2.8. Capacidade de identificar erros e corrigir a execução dos exercícios",
        "2.9. Pesquisa e aprendizagem que tenho realizado sobre metodologias de treino"
      ]
    },
    {
      title: "3. Treinos Práticos e Eventos",
      type: "scale",
      questions: [
        "3.1. Preparação para orientar uma sessão de treino individual",
        "3.2. Preparação para orientar pequenos grupos de atletas",
        "3.3. Capacidade de comunicar e explicar exercícios aos atletas",
        "3.4. Conhecimento sobre organização de estações e circuitos de treino",
        "3.5. Preparação para participar na organização e dinamização de eventos",
        "3.6. Envolvimento na preparação do EvoID Christmas Experience",
        "3.7. Confiança para assumir responsabilidades no campo"
      ]
    },
    {
      title: "4. VEO — Filmagem, Analytics e Player Highlights",
      type: "scale",
      questions: [
        "4.1. Conhecimento sobre a utilização e preparação da Veo Cam 3",
        "4.2. Trabalho de revisão e exploração dos jogos já gravados",
        "4.3. Conhecimento das funcionalidades do Veo Analytics",
        "4.4. Capacidade de identificar e analisar momentos importantes de um jogo",
        "4.5. Conhecimento e utilização do Player Highlights",
        "4.6. Capacidade de criar vídeos individuais de jogadores",
        "4.7. Capacidade de transformar imagens e dados em informação útil para os atletas",
        "4.8. Dedicação à aprendizagem autónoma das ferramentas Veo"
      ]
    },
    {
      title: "5. Redes Sociais e Comunicação",
      type: "scale",
      questions: [
        "5.1. Conhecimento da identidade, dos valores e dos objetivos da EvoID",
        "5.2. Conhecimento sobre gestão de páginas de Instagram",
        "5.3. Capacidade de criar conteúdos para publicações e stories",
        "5.4. Conhecimento de edição de vídeos e imagens",
        "5.5. Iniciativa para apresentar ideias de conteúdos",
        "5.6. Trabalho que tenho desenvolvido para preparar a comunicação digital da EvoID",
        "5.7. Conhecimento dos cuidados com a privacidade e autorização de imagens dos atletas"
      ]
    },
    {
      title: "6. Autonomia e Desenvolvimento Pessoal",
      type: "scale",
      questions: [
        "6.1. Evolução dos meus conhecimentos desde que comecei a participar no projeto",
        "6.2. Capacidade de procurar soluções para as dificuldades",
        "6.3. Confiança para assumir novas responsabilidades",
        "6.4. Capacidade de reconhecer aquilo que ainda preciso de aprender",
        "6.5. Interesse em aprofundar conhecimentos e desenvolver novas competências",
        "6.6. Satisfação com o meu envolvimento atual na EvoID"
      ]
    },
    {
      title: "7. Avaliação da EvoID e do Acompanhamento Recebido",
      subtitle: "Nesta parte, quero que avalies a EvoID e também a minha forma de te orientar.",
      type: "scale",
      questions: [
        "7.1. Clareza das responsabilidades que me foram atribuídas",
        "7.2. Qualidade das orientações que tenho recebido",
        "7.3. Disponibilidade para esclarecer dúvidas e ajudar",
        "7.4. Acesso aos equipamentos e ferramentas necessários",
        "7.5. Clareza na definição de prioridades e objetivos",
        "7.6. Liberdade para apresentar ideias e sugestões",
        "7.7. Oportunidades que tenho tido para aprender e desenvolver competências",
        "7.8. Qualidade do acompanhamento que tenho recebido até agora"
      ]
    },
    {
      title: "8. Reflexão Pessoal",
      subtitle: "Aqui não precisas de dar notas. Quero conhecer a tua opinião e perceber melhor a tua experiência.",
      type: "text",
      questions: [
        "8.1. Quais foram as atividades e tarefas concretas que já realizaste para a EvoID?",
        "8.2. Quais foram as principais coisas que aprendeste até agora?",
        "8.3. Que tarefas começaste e ainda não concluíste? Porquê?",
        "8.4. Que responsabilidades consideras que ainda não desenvolveste suficientemente?",
        "8.5. Quais têm sido as tuas maiores dificuldades?",
        "8.6. O que consideras que te tem impedido de avançar mais?",
        "8.7. O que achas que a EvoID poderia ter feito melhor para facilitar o teu trabalho?",
        "8.8. O que precisas especificamente de mim em termos de orientação, acompanhamento, formação ou organização?",
        "8.9. Existem ferramentas, conhecimentos, recursos ou formações a que gostarias de ter acesso?",
        "8.10. Quais são as atividades dentro da EvoID de que mais gostas e quais são aquelas com que menos te identificas?",
        "8.11. Em que áreas sentes que tens maior capacidade para contribuir?",
        "8.12. Quais seriam os três objetivos concretos que gostarias de alcançar nos próximos 30 dias?",
        "8.13. Se tivesses toda a liberdade para escolher a área em que gostarias de te tornar realmente bom dentro da EvoID daqui a um ano, qual escolherias? Porquê? E o que precisarias de nós para lá chegar?",
        "8.14. Existe alguma responsabilidade que gostarias de assumir e que ainda não tivemos oportunidade de explorar?",
        "8.15. Há alguma coisa que gostarias de me dizer sobre o projeto, a nossa forma de trabalhar ou o teu futuro na EvoID e que ainda não tenhas tido oportunidade de partilhar?"
      ]
    },
    {
      title: "9. Autoavaliação Global",
      subtitle: "Considerando o teu envolvimento, dedicação, iniciativa, aprendizagem e trabalho realizado até hoje:",
      type: "mixed",
      items: [
        { type: "scale", label: "9.1. Que nota atribuis ao teu próprio desempenho global na EvoID?" },
        { type: "text", label: "9.2. Explica os principais motivos da tua avaliação:" },
        { type: "scale", label: "9.3. E que nota atribuis à EvoID relativamente às condições, orientação e acompanhamento que te proporcionou?" },
        { type: "text", label: "9.4. Explica os principais motivos desta avaliação (opcional):" }
      ]
    }
  ];

  const container = document.getElementById("sectionsContainer");
  let qIndex = 0;
  let totalQuestions = 0;

  // Count total questions for progress
  surveyData.forEach(sec => {
    if (sec.type === "scale" || sec.type === "text") totalQuestions += sec.questions.length;
    else if (sec.type === "mixed") totalQuestions += sec.items.length;
  });
  totalQuestions += 2; // name + email fields

  function createScaleHTML(name, label) {
    let buttons = "";
    for (let i = 1; i <= 10; i++) {
      const id = `${name}_${i}`;
      buttons += `<input type="radio" id="${id}" name="${label}" value="${i}/10" required><label for="${id}">${i}</label>`;
    }
    return `<div class="question">
      <label>${label}</label>
      <div class="scale">${buttons}</div>
      <div class="scale-legend"><span>1 — Muito baixo</span><span>10 — Excelente</span></div>
    </div>`;
  }

  function createTextHTML(label, required = true) {
    return `<div class="question"><label>${label}</label><textarea name="${label}" ${required ? "required" : ""} placeholder="Escreve a tua resposta aqui..."></textarea></div>`;
  }

  surveyData.forEach(sec => {
    let html = `<div class="card"><h2>${sec.title}</h2>`;
    if (sec.subtitle) html += `<p class="subtitle">${sec.subtitle}</p>`;

    if (sec.type === "scale") {
      sec.questions.forEach(q => { qIndex++; html += createScaleHTML(`q${qIndex}`, q); });
    } else if (sec.type === "text") {
      sec.questions.forEach(q => { qIndex++; html += createTextHTML(q); });
    } else if (sec.type === "mixed") {
      sec.items.forEach(item => {
        qIndex++;
        html += item.type === "scale" ? createScaleHTML(`q${qIndex}`, item.label) : createTextHTML(item.label, !item.label.includes("opcional"));
      });
    }
    html += `</div>`;
    container.innerHTML += html;
  });

  // Progress tracking
  function updateProgress() {
    const form = document.getElementById("evoidForm");
    const inputs = form.querySelectorAll("input[required], textarea[required]");
    let filled = 0;
    inputs.forEach(input => {
      if (input.type === "radio") {
        const name = input.name;
        if (form.querySelector(`input[name="${CSS.escape(name)}"]:checked`)) filled++;
      } else if (input.value.trim() !== "") {
        filled++;
      }
    });
    // Deduplicate radio groups
    const radioGroups = new Set();
    form.querySelectorAll("input[type=radio][required]").forEach(r => radioGroups.add(r.name));
    const totalRequired = form.querySelectorAll("input[type=text][required], textarea[required]").length + radioGroups.size;
    const actualFilled = form.querySelectorAll("input[type=text][required]").length ? 
      Array.from(form.querySelectorAll("input[type=text][required], textarea[required]")).filter(el => el.value.trim()).length + 
      Array.from(radioGroups).filter(name => form.querySelector(`input[name="${CSS.escape(name)}"]:checked`)).length : 0;
    
    // Simpler approach
    let answered = 0;
    const nameField = document.getElementById("nome");
    const emailField = document.getElementById("email");
    if (nameField.value.trim()) answered++;
    if (emailField.value.trim()) answered++;
    
    surveyData.forEach(sec => {
      if (sec.type === "scale") {
        sec.questions.forEach(q => {
          if (form.querySelector(`input[name="${CSS.escape(q)}"]:checked`)) answered++;
        });
      } else if (sec.type === "text") {
        sec.questions.forEach(q => {
          const ta = form.querySelector(`textarea[name="${CSS.escape(q)}"]`);
          if (ta && ta.value.trim()) answered++;
        });
      } else if (sec.type === "mixed") {
        sec.items.forEach(item => {
          if (item.type === "scale") {
            if (form.querySelector(`input[name="${CSS.escape(item.label)}"]:checked`)) answered++;
          } else {
            const ta = form.querySelector(`textarea[name="${CSS.escape(item.label)}"]`);
            if (ta && ta.value.trim()) answered++;
          }
        });
      }
    });

    const percent = Math.round((answered / totalQuestions) * 100);
    document.getElementById("progressFill").style.width = percent + "%";
    document.getElementById("progressText").textContent = `Progresso: ${percent}%`;
  }

  document.getElementById("evoidForm").addEventListener("input", updateProgress);
  document.getElementById("evoidForm").addEventListener("change", updateProgress);

  document.getElementById("evoidForm").addEventListener("submit", function(e) {
    // Let the form submit normally to Formspree
    const emailField = document.getElementById("email");
    document.getElementById("replyto").value = emailField.value;
    // Progress and validation already handled by browser required attributes
  });

  // Initial progress
  updateProgress();
</script>

</body>
</html>
